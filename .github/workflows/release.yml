# Release on tag v*: Linux zip from the old-glibc container build
# (rust/tools/build_linux.sh) and Windows MSVC zip, each with README.txt,
# LICENSE, NOTICE and THIRD_PARTY_LICENSES.md (rust/tools/release_zip.py),
# plus SHA256SUMS. The release is created as a draft; publish it by hand
# after checking the assets.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: old-glibc build
        run: rust/tools/build_linux.sh
      - name: zip
        run: |
          name="dpmread-${GITHUB_REF_NAME}-linux-x86_64"
          python3 rust/tools/release_zip.py "$name.zip" "$name" \
            rust/target/linux-x86_64/release "" \
            libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dpmread-*.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: build
        working-directory: rust
        run: |
          cargo build --release --locked -p dm-cli -p dm-gui
          python tools/check_dlls.py target/release/dpmread.exe target/release/dpmread-gui.exe
      - name: zip
        run: |
          name="dpmread-${GITHUB_REF_NAME}-windows-x86_64"
          python rust/tools/release_zip.py "$name.zip" "$name" rust/target/release .exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dpmread-*.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum dpmread-*.zip > SHA256SUMS
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "dpmread $GITHUB_REF_NAME" --notes "See CHANGELOG.md." \
            dpmread-*.zip SHA256SUMS
