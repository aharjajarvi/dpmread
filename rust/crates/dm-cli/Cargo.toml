[package]
name = "dm-cli"
description = "Command line Data Matrix reader."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dpmread"
path = "src/main.rs"

[features]
# module classifier on the best failed grid fits (`dm-reader/ml`)
ml = ["dm-reader/ml"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dm-reader = { path = "../dm-reader" }
